name: Publish Docker image

on:
  release:
    types: [published]
  push:
    branches:
      - develop

jobs:
  PushDockerImage:
    name: Push Docker Image - ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    strategy:
      matrix:
        include:
          - name: Smart Factory
            dockerfile: ./smartFactory/Dockerfile
            image: ghcr.io/aryanp281/cirrina-baselines-smartfactory

          - name: Smart Factory Service
            dockerfile: benchmark-s1/smart-factory-service/Dockerfile
            image: ghcr.io/aryanp281/cirrina-baselines-smartfactory-service

          - name: Metrics Collector
            dockerfile: benchmark-s1/metrics-collector/Dockerfile
            image: ghcr.io/aryanp281/cirrina-baselines-smartfactory-collector

          - name: Event Publisher
            dockerfile: benchmark-s1/event-publisher/Dockerfile
            image: ghcr.io/aryanp281/cirrina-baselines-smartfactory-ep

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=unstable,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=nightly,enable=${{ github.ref_name == 'master' }}

            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

            type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}