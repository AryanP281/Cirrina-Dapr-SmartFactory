name: Test Docker image publishing

on:
  push:
    branches:
      - test-ci

jobs:
  BuildDockerImages:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: Smart Factory
            dockerfile: ./smartFactory/Dockerfile
            image: ghcr.io/aryanp281/cirrina-dapr-smartfactory

          - name: Smart Factory Service
            dockerfile: ./benchmark-s1/smart-factory-service/Dockerfile
            image: ghcr.io/aryanp281/cirrina-dapr-smartfactory-service

          - name: Metrics Collector
            dockerfile: ./benchmark-s1/metrics-collector/Dockerfile
            image: ghcr.io/aryanp281/cirrina-dapr-smartfactory-collector

          - name: Event Publisher
            dockerfile: ./benchmark-s1/event-publisher/Dockerfile
            image: ghcr.io/aryanp281/cirrina-dapr-smartfactory-ep

    name: Build Docker Image - ${{ matrix.name }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:test